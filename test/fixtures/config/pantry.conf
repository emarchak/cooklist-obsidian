[pantry]
# staples always stocked — quantity must use the same unit as recipes (pantry
# subtraction only works on unit matches, so keep generous amounts)
"kosher salt" = "400%tsp"
"black pepper" = "200%tsp"
"olive oil" = "100%tbsp"
"extra-virgin olive oil" = "100%tbsp"
"vegetable oil" = "50%tbsp"
"flour" = "30%cups"
"baking soda" = "10%tbsp"
"honey" = "40%tbsp"
"vinegar" = "50%tbsp"
"soy sauce" = "50%tbsp"
"sugar" = "40%cups"
"water" = "20%cups"

# NOTE: subtraction is unit-exact (no tsp<->cup conversion). An ingredient
# used in several units (e.g. olive oil in tbsp AND cup) leaves a small
# residue on the list — just check it off if you have it.
